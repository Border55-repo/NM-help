name: Framework-kontroll

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Kontroller publiseringspakken
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/service-worker.js
